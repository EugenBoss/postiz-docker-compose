services:
  postiz:
    image: postiz-pm-meta-token-envelope:v1.47.0-local
    build:
      context: .
      dockerfile: Dockerfile.meta-token-envelope
    environment:
      POSTIZ_INTEGRATION_TOKEN_ACTIVE_KEY: '${POSTIZ_INTEGRATION_TOKEN_ACTIVE_KEY:?POSTIZ_INTEGRATION_TOKEN_ACTIVE_KEY must be set}'
      POSTIZ_INTEGRATION_TOKEN_KEYS_FILE: /run/secrets/postiz_integration_token_keys
      POSTIZ_INTEGRATION_TOKEN_LEGACY_MODE: reject
    secrets:
      - source: postiz_integration_token_keys
        target: postiz_integration_token_keys
        uid: "0"
        gid: "0"
        mode: 0400

secrets:
  postiz_integration_token_keys:
    file: '${POSTIZ_INTEGRATION_TOKEN_KEYS_HOST_FILE:?POSTIZ_INTEGRATION_TOKEN_KEYS_HOST_FILE must be set}'
