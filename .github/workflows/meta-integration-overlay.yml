name: Meta integration overlay

on:
  pull_request:
    paths:
      - 'Dockerfile.meta-token-envelope'
      - 'docker-compose.meta-token-envelope.yaml'
      - 'POSTIZ_META_TOKEN_ENCRYPTION*.md'
      - 'postiz-token-envelope/**'
      - '.github/workflows/meta-integration-overlay.yml'
  push:
    branches: [main]
    paths:
      - 'Dockerfile.meta-token-envelope'
      - 'docker-compose.meta-token-envelope.yaml'
      - 'POSTIZ_META_TOKEN_ENCRYPTION*.md'
      - 'postiz-token-envelope/**'
      - '.github/workflows/meta-integration-overlay.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify overlay contracts
        run: node --test postiz-token-envelope/*.test.mjs
      - name: Verify patch syntax
        run: |
          node --check postiz-token-envelope/apply-patch.mjs
          node --check postiz-token-envelope/meta-revoke-cli.mjs
